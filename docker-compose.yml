# Base services (HU 01.1). By default, base infrastructure only.
# Extra profiles live in compose/: compose/cluster.yml (Redis Cluster),
# compose/obs.yml (observability) and compose/full.yml (app included).
name: tix-platform

services:
  postgres:
    image: postgres:17
    # pg_stat_statements (HU 03.2 / task 3): query-latency telemetry to measure the
    # p99 of the seat-availability query. It is a PRELOADED library, so the server
    # has to start with it. The extension itself is created by the init script
    # mounted below, which only runs on a fresh data volume.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define it in .env}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tickets"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Without start_period, failures count from second zero and the first run
      # (initdb + CREATE DATABASE + restart) can take longer than interval x retries,
      # leaving the container unhealthy and blocking pgbouncer, which depends on
      # service_healthy. During start_period, failures do not count.
      start_period: 60s

  pgbouncer:
    # The image listens on 5432 by default (LISTEN_PORT); the host publishes 6432.
    # AUTH_TYPE=scram-sha-256 because postgres:17 stores passwords with
    # password_encryption=scram-sha-256; the image entrypoint writes the
    # userlist from DATABASE_URL.
    image: edoburu/pgbouncer:v1.26.0-p0
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/tickets
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    ports: ["${PGBOUNCER_PORT:-6432}:5432"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      # postgresql-client ships in the image, so pg_isready is available.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U app -d tickets"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?define it in .env}"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 10

  kafka:
    # 4.x uses KRaft by default. INTERNAL is the listener for the app running
    # inside the Compose network (full profile); PLAINTEXT advertises localhost
    # for the app running outside Docker.
    image: apache/kafka:4.2.2
    ports: ["${KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 12
      start_period: 20s

volumes:
  pgdata: {}
  redisdata: {}
