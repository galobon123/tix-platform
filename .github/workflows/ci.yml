# HU 01.3 / tasks 1 to 4: build + tests + coverage, secrets and dependencies on every PR.
#
# Deliberate scope: only tasks 1 to 4 of the HU. The image (task 5) is not included
# because there is no Dockerfile yet (it arrives with HU 08.1).
#
# ACTIONS PINNED BY SHA: each "uses:" points to the full commit and carries, on the
# side, as a comment, the version it represents. A tag can move (in March 2026 almost
# all aquasecurity/trivy-action tags were rewritten); a SHA cannot. To update,
# Dependabot (github-actions ecosystem) opens the PR with the new SHA and the version
# comment: see .github/dependabot.yml.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# minimal permissions: this workflow only reads the repo
permissions:
  contents: read

# a new push kills the previous run of the same PR: the PR does not need 5
# simultaneous builds and this helps the p90 of < 10 min. On main it is NOT cancelled:
# that way every main commit keeps its CI result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build, tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # On Windows the executable bit does not travel in the commit, so on a linux
      # runner ./mvnw can give Permission denied. Without this, the failure looks like
      # a Maven problem and not a permissions problem.
      - name: Enable mvnw
        run: chmod +x mvnw

      # verify runs, in order: checkstyle (validate) -> tests (test) ->
      # jacoco:report + jacoco:check + spotless:check (verify).
      # The integration tests bring up REAL PostgreSQL, Redis and Kafka with
      # Testcontainers; the runner already ships Docker, so they really run.
      # IMPORTANT (pom): jacoco:report must run BEFORE jacoco:check; otherwise, when
      # the threshold fails, the report is not generated exactly when it is needed.
      - name: Build, tests and coverage
        run: ./mvnw -B verify

      # The full JaCoCo HTML report is kept as an artifact to see which class dropped
      # in coverage, without having to reproduce the build.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks with fetch-depth: 0 needs the whole history to look for secrets
          # in old commits, not only in the PR diff.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          # Only if the repo belongs to a GitHub ORGANIZATION (on a personal account it
          # is not needed). Free license at gitleaks.io, stored as a repo secret.
          # Uncomment in that case:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  trivy:
    name: trivy (dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Trivy caches its database with actions/cache, and that requires actions: write.
      # (Note: this is not in the trivy-action documentation. If there was no real error
      # requiring it, it can be tried without this permission.)
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Enable mvnw
        run: chmod +x mvnw

      # Trivy resolves the Maven dependency tree over the network if it cannot find
      # the artifact in the local repository. On a GitHub runner that hits Maven
      # Central's rate limit and Trivy dies with FATAL 429, that is, a red build that
      # has nothing to do with a vulnerability. By populating the cache first, Trivy
      # resolves everything locally and the only possible failure is a real CVE.
      - name: Populate the local Maven cache
        run: ./mvnw -B -q dependency:go-offline

      # scan-type: fs, not image. The HU asks for dependency analysis and there is still
      # no Dockerfile or image to scan (HU 08.1). This job scans the source tree: the
      # pom.xml files and the Maven cache.
      #
      # scanners: vuln only. Secrets are covered by gitleaks, in its own job;
      # duplicating the secrets scanner here only adds noise.
      - name: Scan source tree dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          scanners: vuln
          skip-dirs: '**/target'
