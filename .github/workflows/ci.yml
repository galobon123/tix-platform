# HU 01.3 / tareas 1 a 4: build + tests + cobertura, secretos y dependencias en cada PR.
#
# Alcance deliberado: solo tareas 1 a 4 de la HU. La imagen (tarea 5) no entra
# porque no hay Dockerfile todavia (llega con HU 08.1).
#
# ACTIONS FIJADAS POR SHA: cada "uses:" apunta al commit completo y lleva al
# lado, como comentario, la version que representa. Una tag se puede mover (en
# marzo de 2026 reescribieron casi todas las de aquasecurity/trivy-action); un
# SHA no. Para actualizar, Dependabot (ecosistema github-actions) abre el PR con
# el SHA nuevo y el comentario de version: ver .github/dependabot.yml.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# permisos minimos: este workflow solo lee el repo
permissions:
  contents: read

# un push nuevo mata el run anterior del mismo PR: el PR no necesita 5 builds
# simultaneos y esto ayuda al p90 de < 10 min. En main NO se cancela: asi cada
# commit de main conserva su resultado de CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build, tests y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # En Windows el bit de ejecucion no viaja en el commit, asi que en un
      # runner linux ./mvnw puede dar Permission denied. Sin esto, el fallo
      # parece de Maven y no de permisos.
      - name: Habilitar mvnw
        run: chmod +x mvnw

      # verify corre, en orden: checkstyle (validate) -> tests (test) ->
      # jacoco:report + jacoco:check + spotless:check (verify).
      # Los tests de integracion levantan PostgreSQL, Redis y Kafka REALES con
      # Testcontainers; el runner ya trae Docker, asi que corren de verdad.
      # IMPORTANTE (pom): jacoco:report debe ir ANTES que jacoco:check; si no,
      # cuando falla el umbral no se genera el reporte justo cuando hace falta.
      - name: Build, tests y cobertura
        run: ./mvnw -B verify

      # El reporte HTML completo de JaCoCo queda como artefacto para ver que
      # clase bajo la cobertura, sin tener que reproducir el build.
      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks (secretos)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks con fetch-depth: 0 necesita todo el historico para buscar
          # secretos en commits viejos, no solo en el diff del PR.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          # Solo si el repo pertenece a una ORGANIZACION de GitHub (en una cuenta
          # personal no hace falta). Licencia gratuita en gitleaks.io, guardada
          # como secreto del repo. Descomentar en ese caso:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  trivy:
    name: trivy (dependencias)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Trivy cachea su base de datos con actions/cache, y eso exige actions: write.
      # (Ojo: esto no figura en la documentacion de trivy-action. Si no hubo un
      # error real que lo exigiera, se puede probar sin este permiso.)
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Habilitar mvnw
        run: chmod +x mvnw

      # Trivy resuelve el arbol de dependencias de Maven por red si no encuentra
      # el artefacto en el repositorio local. En un runner de GitHub eso se topa
      # con el rate limit de Maven Central y Trivy muere con FATAL 429, o sea un
      # build rojo que no tiene nada que ver con una vulnerabilidad. Poblando el
      # cache primero, Trivy resuelve todo local y el unico fallo posible es un
      # CVE real.
      - name: Poblar cache local de Maven
        run: ./mvnw -B -q dependency:go-offline

      # scan-type: fs, no image. La HU pide analisis de dependencias y todavia
      # no hay Dockerfile ni imagen que escanear (HU 08.1). Este job escanea el
      # arbol de fuentes: los pom.xml y el cache de Maven.
      #
      # scanners: vuln solamente. Los secretos los cubre gitleaks, en su propio
      # job; duplicar el scanner de secretos aqui solo anade ruido.
      - name: Escanear dependencias del arbol de fuentes
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          scanners: vuln
          skip-dirs: '**/target'