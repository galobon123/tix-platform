# HU 01.3 / tarea 4: CodeQL (SAST) sobre Java.
#
# CodeQL va en su propio workflow (y no como job del ci) porque es lo que
# recomienda GitHub: asi el analisis corre en su propio grupo de checks y se
# puede exigir por separado en branch protection.
#
# Solo analiza Java: el proyecto todavia no tiene JS ni Python.
name: codeql

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Corre sola aunque nadie toque el repo: las queries de CodeQL se actualizan
    # y eso puede marcar vulnerabilidades nuevas en codigo viejo.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analizar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # security-events: write es lo que le permite publicar el SARIF.
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin]

    steps:
      - uses: actions/checkout@v7

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Con Dependabot los alerts de seguridad ya se abren solos; este
          # detector FindsDuplicateCode solo sirve si el repo es publico.
          queries: security-extended

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar proyecto
        run: |
          chmod +x mvnw
          ./mvnw clean compile -DskipTests

      - name: Analizar
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'