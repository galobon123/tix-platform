# HU 01.3 / task 4: CodeQL (SAST) on Java.
#
# CodeQL goes in its own workflow (and not as a job of ci) because that is what
# GitHub recommends: this way the analysis runs in its own check group and can be
# required separately in branch protection.
#
# It only analyzes Java: the project has no JS or Python yet.
name: codeql

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Runs on its own even if nobody touches the repo: CodeQL queries are updated
    # and that can flag new vulnerabilities in old code.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # security-events: write is what lets it publish the SARIF.
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # With Dependabot, security alerts already open on their own; this
          # FindsDuplicateCode detector only helps if the repo is public.
          queries: security-extended

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build project
        run: |
          chmod +x mvnw
          ./mvnw clean compile -DskipTests

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
