# HU 01.3 / task 4: Dependabot.
#
# Dependabot was chosen over Renovate because it is built into GitHub, does not ask
# for a bot token and already knows how to read Maven poms without extra configuration.
version: 2

updates:
  # ------------------------------------------------------------------ Maven
  # Single entry for the WHOLE reactor. Empirically, Dependabot's Maven ecosystem
  # resolves parent + ALL module poms from one entry (the "/" entry proposes bumps
  # from api/pom.xml too). One entry per dependency = one PR. Previously, one entry
  # per module opened one duplicate PR per directory, all editing the same pom.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, java]
    groups:
      # Testcontainers and its modules have to move together: mixing one version of
      # testcontainers-postgresql with another of testcontainers-kafka breaks the build.
      testcontainers:
        patterns: [org.testcontainers.*, com.redis.testcontainers-redis]
      # The Spring Boot BOM manages the versioning of Testcontainers 2.x;
      # touching it by hand fights the BOM.
      spring:
        patterns: [org.springframework.*]

  # -------------------------------------------------------- GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]

  # ------------------------------------------------------------------ Docker
  # deliberately commented out: HU 08.1 is the one that brings the Dockerfile and
  # until then Dependabot fails with "no Dockerfile found" if it is enabled.
