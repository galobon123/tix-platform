# HU 01.3 / task 4: gitleaks configuration.
#
# It extends the default gitleaks config instead of writing the rules by hand:
# the default already knows the API key formats of AWS, GitHub, GCP, JWT and more.
# Writing your own regex is usually worse: it either lets secrets through or fills
# the repo with false positives.
title = "tix-platform"

[extend]
useDefault = true

# Global allowlist (new syntax: [[allowlists]], not whitelist).
[[allowlists]]
description = "Paths that are not secrets even if the regex flags them"
paths = [
  # Documentation: the HU examples use placeholders like <token>, but some look
  # like a real key and trigger false positives.
  '''(?i)docs/''',
  '''(?i)\.md$''',
  # Lock files: Maven checksum hashes are long hex and look like some token formats.
  '''(?i)\.lock$''',
  '''(?i)target/''',
  # HU 01.1 stack. These are development values, not production secrets.
  '''(?i)docker-compose.*\.ya?ml$''',
  '''(?i)\.env\.example$''',
]

# Separate allowlist, only for those paths, to tolerate placeholders.
[[allowlists]]
description = "Placeholders in docker-compose and .env.example"
regexes = [
  '''(?i)change-me''',
  '''(?i)example''',
  '''(?i)sample''',
  '''(?i)dummy''',
  '''(?i)placeholder''',
]
paths = [
  '''(?i)docker-compose.*\.ya?ml$''',
  '''(?i)\.env\.example$''',
]
