# Perfil `obs`: stack de observabilidad (HU 09). Se usa con la infra base:
#   make obs
#   make obs-down
#
# Prometheus y Alloy se scrapean entre si por el servicio, no por localhost:
# cada contenedor ve a los otros por el DNS de la red de Compose.
name: tix-platform

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["obs"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./compose/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]

  loki:
    image: grafana/loki:3.7.8
    profiles: ["obs"]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./compose/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports: ["${LOKI_PORT:-3100}:3100"]

  alloy:
    image: grafana/alloy:v1.20.1
    profiles: ["obs"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./compose/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports: ["${ALLOY_PORT:-12345}:12345"]
    depends_on: [loki]

  otel:
    image: otel/opentelemetry-collector-contrib:0.161.0
    profiles: ["obs"]
    command: ["--config=/etc/otel/otel-collector.yml"]
    volumes:
      - ./compose/otel/otel-collector.yml:/etc/otel/otel-collector.yml:ro
      - otel-data:/var/lib/otel
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["obs"]
    environment:
      # Credencial solo de desarrollo local. En staging/prod sale de un secreto.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus, loki]

volumes:
  prometheus-data: {}
  loki-data: {}
  alloy-data: {}
  otel-data: {}
  grafana-data: {}