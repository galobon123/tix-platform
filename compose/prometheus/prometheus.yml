global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # Alloy expone sus propias metricas en /metrics del servidor HTTP.
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # Solo con el perfil `full` (make full). Sin la app, el target queda DOWN.
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]