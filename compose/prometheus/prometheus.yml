global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # Alloy exposes its own metrics at /metrics on the HTTP server.
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # Only with the `full` profile (make full). Without the app, the target stays DOWN.
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
