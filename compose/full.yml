# `full` profile: on top of the base infrastructure, it brings up the app.
# Usage: make full   (equivalent to COMPOSE_FILE=docker-compose.yml:compose/full.yml docker compose --profile full up -d --wait)
#
# The image is built by HU 08.1. Meanwhile it is expected to exist
# locally as tix-api:local (or override it with API_IMAGE).
name: tix-platform

services:
  api:
    image: ${API_IMAGE:-tix-api:local}
    profiles: ["full"]
    ports: ["${API_PORT:-8080}:8080"]
    environment:
      # Migrations (Flyway) against DIRECT Postgres, never through PgBouncer:
      # DDL and session locks do not survive the pool in transaction mode.
      DB_URL: jdbc:postgresql://postgres:5432/tickets
      DB_USER: app
      DB_PASSWORD: ${POSTGRES_PASSWORD:?define it in .env}
      # App traffic, pooled.
      POOL_URL: jdbc:postgresql://pgbouncer:5432/tickets
      REDIS_URL: redis://redis:6379
      REDIS_LOCKS_URL: redis://redis:6379
      # INTERNAL listener: inside the Compose network localhost is not used.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4317
      JWT_SECRET: ${JWT_SECRET:?define it in .env}
    depends_on:
      postgres: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      # Assumes the image ships wget or curl. If HU 08.1 builds a distroless
      # image, declare a HEALTHCHECK in the Dockerfile instead of relying on a
      # binary that does not exist.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
